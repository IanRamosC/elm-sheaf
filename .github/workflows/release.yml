name: Release

on:
  push:
    tags: ["v*"]

# Two pushes of the same tag never publish at once, and a release under way is
# never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the CLI's version
        run: |
          version=$(jq --raw-output .version cli/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match cli/package.json's version, $version."
            exit 1
          fi
          if [[ "$version" == *-dev ]]; then
            echo "::error::$version is a development version, which is never released."
            exit 1
          fi

  # Built on macOS, which has codesign: the macOS binaries need a signature
  # that verifies, or macOS refuses to run them.
  binaries:
    needs: [ci, tag-check]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/package.json

      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Build the binaries
        working-directory: cli
        run: bun run build-binaries

      # build-binaries signs them too. Signing again here keeps the release
      # from depending on that, and the verification fails the job on a
      # signature macOS would reject.
      - name: Sign the macOS binaries
        working-directory: cli
        run: |
          codesign --force --sign - out/sheaf-darwin-x64 out/sheaf-darwin-arm64
          codesign --verify --strict -vv out/sheaf-darwin-x64 out/sheaf-darwin-arm64
          out/sheaf-darwin-arm64 --version

      - name: Write the checksums
        working-directory: cli/out
        run: |
          shasum --algorithm 256 -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: cli/out/
          if-no-files-found: error
          retention-days: 7

  # The Intel binary is cross-compiled on Apple Silicon, so it runs here, on
  # an Intel Mac, before anything is published.
  intel-binary:
    needs: binaries
    runs-on: macos-15-intel
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: out

      - name: Run the Intel binary
        working-directory: out
        run: |
          chmod +x sheaf-darwin-x64
          version=$(./sheaf-darwin-x64 --version)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::sheaf-darwin-x64 --version printed $version, not ${GITHUB_REF_NAME#v}."
            exit 1
          fi

  # Trusted publishing authenticates through OIDC and needs npm 11.5.1 or
  # newer, which Node 24 bundles. A version npm already has is skipped, since
  # npm never takes it again, so that a re-run can still reach the release.
  npm:
    needs: intel-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to npm
        run: |
          version=$(jq --raw-output .version package.json)
          if [ "$(npm view "elm-sheaf@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::elm-sheaf $version is already on npm, so it isn't published again."
          else
            npm publish --provenance --access public
          fi

  # Creates the release, or brings the files of one an earlier run created up
  # to date.
  release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: cli/out

      - name: Publish the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" cli/out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" cli/out/* \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
