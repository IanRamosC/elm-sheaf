name: Feature request
description: Something Sheaf doesn't do yet, or could do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The site you're building and what gets in the way. A real case helps more than a proposed API.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working, from the Markdown, the Elm or the command line.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Any workaround you use, or other tools that do this well.
